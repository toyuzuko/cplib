[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cplib"
version = "0.1.0"
description = "Competitive programming library for Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "autoflake",
    "black",
    "isort",
    "online-judge-verify-helper",
    "pyright>=1.1.414",
    # verification-helper 5.6.0 imports pkg_resources.
    "setuptools<81",
]

[tool.pyright]
include = ["cplib"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
extraPaths = ["."]
stubPath = ".vscode/stubs"
venvPath = "."
venv = ".venv"

[tool.setuptools.packages.find]
include = ["cplib*"]
